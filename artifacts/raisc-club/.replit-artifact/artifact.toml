kind = "web"
previewPath = "/"
title = "RAISC Robotics Club"
description = "A minimal dark futuristic website for GKCIET's Robotics, AI and Intelligent Systems Club, sharing its focus, history, activities and ways to get involved."
version = "1.0.0"
id = "artifacts/raisc-club"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20853

[services.development]
run = "pnpm --filter @workspace/raisc-club run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/raisc-club", "run", "build" ]
serve = "static"
publicDir = "artifacts/raisc-club/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20853"
BASE_PATH = "/"
